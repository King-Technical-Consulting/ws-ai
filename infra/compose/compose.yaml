# ws deployment. Combine the base with one hardware override and, in
# production, an ingress profile:
#
#   docker compose -f compose.yaml -f override.orin-cuda.yaml --profile cloudflare up -d
#   docker compose -f compose.yaml -f override.amd-rocm.yaml  --profile tailscale  up -d
#   docker compose -f compose.yaml -f override.spark-cuda.yaml --profile cloudflare up -d
#
# or `make up HW=orin-cuda INGRESS=cloudflare` from the repo root.
# Dev on a laptop: `make db-up` runs only Postgres; the Go binary runs natively.
#
# All secrets and per-box URLs come from ../../.env (see .env.example).
# Nothing here publishes a port to the network except Postgres on loopback.

name: ws

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-ws-env: &ws-env
  WS_DATABASE_URL: postgres://ws:${POSTGRES_PASSWORD:-ws}@postgres:5432/ws?sslmode=disable
  WS_BLOB_DIR: /data/blobs
  WS_LISTEN: ":8080"
  WS_ARTIFACT_LISTEN: ":8081"
  WS_ENDPOINTS_FILE: /app/config/endpoints.yaml
  WS_POLICIES_DIR: /app/config/policies

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ws
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ws}
      POSTGRES_DB: ws
    command: >
      postgres -c shared_buffers=256MB -c max_connections=100
      -c log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ws -d ws"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API, web UI (:8080) and the artifact origin (:8081). Runs migrations on boot.
  app:
    image: ${WS_IMAGE:-ghcr.io/king-technical-consulting/ws:latest}
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    command: ["serve"]
    restart: unless-stopped
    logging: *logging
    env_file: ../../.env
    environment:
      <<: *ws-env
    volumes:
      - blobs:/data/blobs
      # Files referenced from .env by path (GitHub App key, the Claude Code
      # launcher's ssh key, ssh_config and targets.toml, …). Read-only; the
      # directory is gitignored. Point GITHUB_APP_PRIVATE_KEY_FILE,
      # WS_CC_TARGETS and WS_CC_SSH_CONFIG at /secrets/<name>
      # (see infra/launcher/README.md).
      - ../../secrets:/secrets:ro
    # app joins sandbox-net only to reverse-proxy dev-server previews to
    # sandbox containers; it never gets the Docker socket.
    networks:
      - default
      - sandbox-net
    # The host as a launcher target: an ssh_config HostName of
    # host.docker.internal reaches this box's sshd from the container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # distroless has no shell or curl; the binary checks itself.
      test: ["CMD", "/app/ws", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Background work: health probes, jobs (M3+), sandboxes (M4+).
  worker:
    image: ${WS_IMAGE:-ghcr.io/king-technical-consulting/ws:latest}
    command: ["worker"]
    restart: unless-stopped
    logging: *logging
    env_file: ../../.env
    environment:
      <<: *ws-env
    volumes:
      - blobs:/data/blobs
      - ../../secrets:/secrets:ro
      # Docker socket for coding sandboxes (M4). Only the worker gets it.
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as a non-root user; the socket is root:docker on the
    # host, so join that group. `make up` sets DOCKER_GID from the socket.
    group_add:
      - "${DOCKER_GID:-999}"
    # The worker joins sandbox-net so sandboxes can reach its egress proxy
    # (http://worker:3128); it stays on default to reach Postgres.
    networks:
      - default
      - sandbox-net
    # spawn_job's subscription lane launches over ssh from here; same
    # host alias as app (infra/launcher/README.md).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy   # app owns migrations; wait for it

  # ---- MCP servers (profile "infisical") ----
  # Infisical's MCP server is stdio-only; supergateway bridges it to
  # Streamable HTTP on the internal network. ws connects per config/mcp.yaml
  # and exposes its tools as mcp__infisical__<tool> under ask/deny policies.
  # Use a separate, least-privilege machine identity for this; values are
  # masked unless INFISICAL_MCP_MASK=false.
  mcp-infisical:
    image: supercorp/supergateway:latest
    restart: unless-stopped
    logging: *logging
    profiles: ["infisical"]
    command:
      - --stdio
      - npx -y @infisical/mcp
      - --outputTransport
      - streamableHttp
      - --port
      - "8000"
      - --streamableHttpPath
      - /mcp
      - --stateful
    environment:
      INFISICAL_AUTH_METHOD: universal-auth
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_MCP_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_MCP_CLIENT_SECRET:-}
      INFISICAL_HOST_URL: ${INFISICAL_SITE_URL:-https://app.infisical.com}
      INFISICAL_MASK_SECRET_VALUES: ${INFISICAL_MCP_MASK:-true}
      INFISICAL_ENABLED_TOOLS: ${INFISICAL_MCP_TOOLS:-list-projects,list-secrets,get-secret,create-secret,update-secret}

  # ---- Ingress: pick one profile ----

  # Cloudflare Tunnel (remote-managed). In the Zero Trust dashboard, give the
  # tunnel three public hostnames:
  #   app.<domain>        -> http://app:8080
  #   art.<domain>        -> http://app:8081
  #   *.preview.<domain>  -> http://app:8080   (sandbox dev-server previews, M4)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *logging
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # required with --profile cloudflare
    depends_on:
      app:
        condition: service_healthy
    profiles: ["cloudflare"]

  # Tailscale sidecar: joins your tailnet as "ws" and serves
  #   https://ws.<tailnet>.ts.net       -> app:8080
  #   https://ws.<tailnet>.ts.net:8443  -> app:8081  (artifacts)
  # Friends must be on your tailnet. Set WS_PUBLIC_URL / WS_ARTIFACT_URL to those.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ws
    restart: unless-stopped
    logging: *logging
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}                  # required with --profile tailscale
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --advertise-tags=tag:ws
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    depends_on:
      app:
        condition: service_healthy
    profiles: ["tailscale"]

  # ---- Continuous delivery ----
  # Not a container. Watchtower was tried and dropped: it recreates a
  # container with only its first network, which detached `app` from
  # traefik-net and 404'd the site. CD is a host-side systemd timer that
  # runs infra/compose/ws-deploy.sh (git pull, compose pull, compose up), so
  # every update goes through Compose's own config. Install with
  # `make install-cd`.

volumes:
  pgdata:
  blobs:
  tsstate:

networks:
  default:
  # Internal network for coding sandboxes; no direct egress. Worker joins it (M4).
  sandbox-net:
    internal: true
