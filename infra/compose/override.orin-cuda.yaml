# Jetson AGX Orin (arm64, JetPack 6.x, CUDA 12.x). Runs the whole stack plus
# llama-server with CUDA. Requires nvidia-container-toolkit (ships with JetPack).
#
#   docker compose -f compose.yaml -f override.orin-cuda.yaml up -d
#
# Models live in ../../data/models (GGUF). Download with:
#   huggingface-cli download unsloth/gpt-oss-20b-GGUF gpt-oss-20b-Q4_K_M.gguf --local-dir data/models
#
# Memory: 64 GB Orin fits gpt-oss-20b (~13 GB) + Qwen3-30B-A3B Q4 (~18 GB) with
# room for KV cache. 32 GB Orin: pick one of gpt-oss-20b or Qwen3-14B.

services:
  llama:
    # Official llama.cpp server image, CUDA build, multi-arch. Pin a tag in prod.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "1"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8000"
    command: >
      --model /models/gpt-oss-20b-Q4_K_M.gguf
      --alias gpt-oss-20b
      --ctx-size 32768
      --n-gpu-layers 999
      --parallel 4
      --flash-attn on
      --jinja
      --reasoning-format deepseek
      --metrics
    volumes:
      - ../../data/models:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

  # Small embedding model on the same box for agent memory (M7).
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8001"
    command: >
      --model /models/nomic-embed-text-v1.5.Q8_0.gguf
      --alias nomic-embed-text-v1.5
      --embedding
      --pooling mean
      --ctx-size 8192
      --n-gpu-layers 999
    volumes:
      - ../../data/models:/models:ro
    ports:
      - "127.0.0.1:8001:8001"
    profiles: ["embed"]

  app:
    environment:
      LLAMA_SERVER_URL: http://llama:8000/v1
    depends_on:
      llama:
        condition: service_healthy

  worker:
    environment:
      LLAMA_SERVER_URL: http://llama:8000/v1
