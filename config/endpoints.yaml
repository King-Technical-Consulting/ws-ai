# Providers and endpoints seeded into the database on boot (upsert by id).
# API keys are referenced by environment variable name, never stored here.
# Pricing is USD per million tokens. Local endpoints are free but still
# tracked. Capabilities are declared because engines rarely report them.
#
# Edit in the admin UI after boot; this file is only the seed. Set
# WS_ENDPOINTS_SEED_MODE=overwrite to force this file to win.

providers:
  - id: anthropic
    kind: anthropic
    name: Anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY

  - id: openrouter
    kind: openai_compat
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    headers:
      HTTP-Referer: https://github.com/King-Technical-Consulting/ws-ai
      X-Title: ws

  - id: openai
    kind: openai_compat
    name: OpenAI
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  # Cerebras direct (wafer-scale, ~3000 tok/s on gpt-oss-120b). Also
  # reachable through OpenRouter as a pinned route; direct is cheaper.
  - id: cerebras
    kind: openai_compat
    name: Cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY

  # Local inference. Base URLs come from env so the same file works on every box.
  - id: local-llama
    kind: openai_compat
    name: llama-server (local)
    base_url_env: LLAMA_SERVER_URL

  - id: local-vllm
    kind: openai_compat
    name: vLLM (Spark)
    base_url_env: VLLM_URL

  - id: mac-studio
    kind: openai_compat
    name: Mac Studio (MLX)
    base_url_env: MAC_STUDIO_URL

  # Media providers (PLAN.md M6). fal.ai fronts hundreds of image and video
  # models behind one queue API; the endpoint's model is the fal model id.
  - id: fal
    kind: openai_compat
    name: fal.ai
    base_url: https://queue.fal.run
    api_key_env: FAL_KEY

  # A local ComfyUI server; its endpoints name a workflow template under
  # infra/comfyui/workflows in extra_body.
  - id: comfyui
    kind: openai_compat
    name: ComfyUI (local)
    base_url_env: COMFYUI_URL

  # Google's Gemini API for Imagen (images) and Veo (video); the key is
  # sent as x-goog-api-key.
  - id: google
    kind: openai_compat
    name: Google (Gemini API)
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY

endpoints:
  # ---- Anthropic ----
  - id: anthropic/claude-opus-5-5
    provider: anthropic
    model: claude-opus-5-5
    display_name: Claude Opus 5.5
    capabilities: { context_window: 1000000, max_output: 128000, tools: true, vision: true, json_mode: true, reasoning: true, prompt_cache: true }
    pricing: { input_per_m: 4.00, output_per_m: 20.00, cache_read_per_m: 0.20, cache_write_per_m: 5.00 }
    throughput_class: high
    latency_class: normal

  - id: anthropic/claude-sonnet-5-5
    provider: anthropic
    model: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    capabilities: { context_window: 1000000, max_output: 128000, tools: true, vision: true, json_mode: true, reasoning: true, prompt_cache: true }
    pricing: { input_per_m: 2.00, output_per_m: 10.00, cache_read_per_m: 0.20, cache_write_per_m: 2.50 }
    throughput_class: high
    latency_class: fast

  - id: anthropic/claude-haiku-4-5
    provider: anthropic
    model: claude-haiku-4-5
    display_name: Claude Haiku 4.5
    capabilities: { context_window: 200000, max_output: 64000, tools: true, vision: true, json_mode: true, reasoning: true, prompt_cache: true }
    pricing: { input_per_m: 1.00, output_per_m: 5.00, cache_read_per_m: 0.10, cache_write_per_m: 1.25 }
    throughput_class: high
    latency_class: fast

  # ---- OpenAI embeddings (agent memory, PLAN.md M7) ----
  # agent_memory.embedding is 768 wide, so the model is asked for that
  # width (extra_body is merged into every request). Local nomic-embed
  # is preferred by policy; this is the hosted fallback.
  - id: openai/text-embedding-3-small
    provider: openai
    model: text-embedding-3-small
    display_name: text-embedding-3-small (OpenAI)
    capabilities: { context_window: 8191, embeddings: true }
    pricing: { input_per_m: 0.02, output_per_m: 0 }
    extra_body: { dimensions: 768 }
    throughput_class: high
    latency_class: fast

  # ---- OpenAI Images (media endpoint, PLAN.md M6) ----
  # `capabilities.media` makes this an image endpoint: text routing never
  # picks it and task class `image` routes only to endpoints like it. The
  # engine names the adapter in internal/media. gpt-image-1 reports token
  # usage, so the per-token rates (text in, image out) price each job by
  # its real quality and size; per_image is the estimate shown before a
  # job runs (medium quality, 1024x1024).
  - id: openai/gpt-image-1
    provider: openai
    model: gpt-image-1
    display_name: GPT Image 1 (OpenAI)
    capabilities: { media: { engine: openai_images, image: true, image_edit: true, sizes: [1024x1024, 1536x1024, 1024x1536, auto], max_images: 4 } }
    pricing: { input_per_m: 5.00, output_per_m: 40.00, per_image: 0.04 }
    throughput_class: medium
    latency_class: slow

  # ---- OpenAI Videos (Sora 2) ----
  # Billed per second of output; the lengths Sora accepts are listed so
  # the picker offers only those. Image to video sends the source as
  # input_reference. Disabled until tried: enable it in Admin.
  - id: openai/sora-2
    provider: openai
    model: sora-2
    display_name: Sora 2 (OpenAI)
    capabilities: { media: { engine: openai_videos, video: true, image_to_video: true, sizes: [1280x720, 720x1280], max_seconds: 12, seconds: [4, 8, 12] } }
    pricing: { per_second: 0.10 }
    throughput_class: low
    latency_class: slow
    enabled: false

  # ---- fal.ai ----
  # One engine, many models: the model is fal's id. Prices are per image or
  # per second and change often; check fal.ai/models before relying on
  # them. Model-specific inputs go in extra_body (ws sends prompt,
  # num_images, image_size, image_url and duration).
  - id: fal/flux-dev
    provider: fal
    model: fal-ai/flux/dev
    display_name: FLUX.1 dev (fal)
    capabilities: { media: { engine: fal, image: true, sizes: [1024x1024, 1344x768, 768x1344, landscape_16_9, portrait_16_9, square_hd], max_images: 4 } }
    pricing: { per_image: 0.025 }
    throughput_class: medium
    latency_class: normal

  - id: fal/flux-kontext
    provider: fal
    model: fal-ai/flux-pro/kontext
    display_name: FLUX.1 Kontext (fal, edits)
    capabilities: { media: { engine: fal, image_edit: true, max_images: 1 } }
    pricing: { per_image: 0.04 }
    throughput_class: medium
    latency_class: normal

  - id: fal/wan-2.2-t2v
    provider: fal
    model: fal-ai/wan/v2.2-a14b/text-to-video
    display_name: Wan 2.2 text to video (fal)
    capabilities: { media: { engine: fal, video: true, sizes: [16:9, 9:16], max_seconds: 5, seconds: [5] } }
    pricing: { per_second: 0.08 }
    throughput_class: low
    latency_class: slow
    enabled: false

  - id: fal/wan-2.2-i2v
    provider: fal
    model: fal-ai/wan/v2.2-a14b/image-to-video
    display_name: Wan 2.2 image to video (fal)
    capabilities: { media: { engine: fal, image_to_video: true, max_seconds: 5, seconds: [5] } }
    pricing: { per_second: 0.08 }
    throughput_class: low
    latency_class: slow
    enabled: false

  # ---- ComfyUI (local) ----
  # Free, on your own GPU. The model is the checkpoint file name the
  # workflow's loader gets as {{model}}; the workflow is a template under
  # infra/comfyui/workflows. Enable it once COMFYUI_URL points at a server.
  - id: comfyui/sdxl
    provider: comfyui
    model: sd_xl_base_1.0.safetensors
    display_name: SDXL (ComfyUI)
    capabilities: { media: { engine: comfyui, image: true, image_edit: true, sizes: [1024x1024, 1344x768, 768x1344], max_images: 4 } }
    extra_body: { workflow: sdxl-text-to-image.json, negative: "blurry, low quality, watermark, text" }
    local: true
    throughput_class: low
    latency_class: slow
    enabled: false

  # An upscaler on fal: a source image to 2x or 4x (ws sends image_url
  # and upscale_factor; the prompt is optional guidance).
  - id: fal/clarity-upscaler
    provider: fal
    model: fal-ai/clarity-upscaler
    display_name: Clarity upscaler (fal)
    capabilities: { media: { engine: fal, upscale: true, max_images: 1 } }
    pricing: { per_image: 0.03 }
    throughput_class: medium
    latency_class: normal

  # ---- Google (Gemini API) ----
  # Imagen prices per image, Veo per second; both change, check
  # ai.google.dev/pricing. Sizes are aspect ratios. Veo ships disabled
  # until tried: enable it in Admin.
  - id: google/imagen-4
    provider: google
    model: imagen-4.0-generate-001
    display_name: Imagen 4 (Google)
    capabilities: { media: { engine: google, image: true, sizes: ["1:1", "3:4", "4:3", "9:16", "16:9"], max_images: 4 } }
    pricing: { per_image: 0.04 }
    throughput_class: medium
    latency_class: normal

  - id: google/veo-3
    provider: google
    model: veo-3.0-generate-001
    display_name: Veo 3 (Google)
    capabilities: { media: { engine: google, video: true, image_to_video: true, sizes: ["16:9", "9:16"], max_seconds: 8, seconds: [8] } }
    pricing: { per_second: 0.40 }
    throughput_class: low
    latency_class: slow
    enabled: false

  # ---- OpenRouter (examples; add what you use) ----
  - id: openrouter/google/gemini-2.5-pro
    provider: openrouter
    model: google/gemini-2.5-pro
    display_name: Gemini 2.5 Pro (OpenRouter)
    capabilities: { context_window: 1000000, max_output: 65536, tools: true, vision: true, json_mode: true, reasoning: true }
    pricing: { input_per_m: 1.25, output_per_m: 10.00 }
    throughput_class: high
    latency_class: normal

  - id: openrouter/deepseek/deepseek-chat-v3
    provider: openrouter
    model: deepseek/deepseek-chat-v3-0324
    display_name: DeepSeek V3 (OpenRouter)
    capabilities: { context_window: 128000, max_output: 16000, tools: true, vision: false, json_mode: true }
    pricing: { input_per_m: 0.30, output_per_m: 0.88 }
    throughput_class: medium
    latency_class: normal

  # ---- Cerebras direct ----
  # Prices from cerebras.ai/pricing (Oct 2025); adjust if they change.
  - id: cerebras/gpt-oss-120b
    provider: cerebras
    model: gpt-oss-120b
    display_name: gpt-oss-120b (Cerebras)
    capabilities: { context_window: 131072, max_output: 40960, tools: true, vision: false, json_mode: true, reasoning: true }
    pricing: { input_per_m: 0.25, output_per_m: 0.69 }
    throughput_class: high
    latency_class: fast

  # The same model via OpenRouter, pinned to Cerebras. `extra_body` is
  # merged into every request; `provider.order` + `allow_fallbacks: false`
  # is OpenRouter's provider-routing syntax. The admin UI writes entries
  # like this from "Routes" on a catalog model.
  - id: openrouter/openai/gpt-oss-120b@cerebras
    provider: openrouter
    model: openai/gpt-oss-120b
    display_name: gpt-oss-120b via Cerebras (OpenRouter)
    capabilities: { context_window: 131072, max_output: 40960, tools: true, vision: false, json_mode: true, reasoning: true }
    pricing: { input_per_m: 0.35, output_per_m: 0.75 }
    extra_body: { provider: { order: [cerebras], allow_fallbacks: false } }
    throughput_class: high
    latency_class: fast

  # ---- Local: W7700 16 GB / Orin via llama-server ----
  - id: local-llama/gpt-oss-20b
    provider: local-llama
    model: gpt-oss-20b
    display_name: gpt-oss-20b (local)
    local: true
    capabilities: { context_window: 131072, max_output: 32768, tools: true, vision: false, json_mode: true, reasoning: true }
    throughput_class: low
    latency_class: normal

  - id: local-llama/qwen3-14b
    provider: local-llama
    model: qwen3-14b
    display_name: Qwen3 14B (local)
    local: true
    capabilities: { context_window: 40960, max_output: 8192, tools: true, vision: false, json_mode: true, reasoning: true }
    throughput_class: low
    latency_class: normal

  - id: local-llama/nomic-embed-text
    provider: local-llama
    model: nomic-embed-text-v1.5
    display_name: nomic-embed (local)
    local: true
    capabilities: { context_window: 8192, embeddings: true }
    throughput_class: medium
    latency_class: fast

  # ---- Local: Spark via vLLM (enable when the box arrives) ----
  - id: local-vllm/qwen3-coder-next
    provider: local-vllm
    model: Qwen/Qwen3-Coder-Next
    display_name: Qwen3-Coder-Next 80B-A3B (Spark)
    local: true
    enabled: false
    capabilities: { context_window: 262144, max_output: 32768, tools: true, vision: false, json_mode: true, reasoning: true }
    throughput_class: high
    latency_class: fast

  - id: local-vllm/qwen3.6-35b-a3b
    provider: local-vllm
    model: Qwen/Qwen3.6-35B-A3B
    display_name: Qwen3.6 35B-A3B (Spark)
    local: true
    enabled: false
    capabilities: { context_window: 262144, max_output: 32768, tools: true, vision: true, json_mode: true, reasoning: true }
    throughput_class: high
    latency_class: fast
